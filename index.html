<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loader Example</title>
    <style>
      /* Loader full-screen container */
      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f4f4f4;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      /* Loader animation */
      .loader {
        border: 8px solid #e0e0e0;
        border-top: 8px solid #3498db;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Optional: hide loader after content loads */
      body.loaded #loader-wrapper {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Loader HTML -->
    <div id="loader-wrapper">
      <div class="loader"></div>
    </div>

    <!-- Your content here -->
    <div id="main-content" style="padding: 20px">
      <h1>Welcome to My Page</h1>
      <p>This content will be visible after the loader disappears.</p>
    </div>

    <script>
      // Simulate content loading
      window.addEventListener("load", () => {
        document.body.classList.add("loaded");
      });
    </script>
  </body>
</html>
